[package]
name = "batchgrade"
version = "0.1.0"
description = "A local-first desktop application for grading programming assignments."
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "batchgrade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
uuid = { version = "1", features = ["v4"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
