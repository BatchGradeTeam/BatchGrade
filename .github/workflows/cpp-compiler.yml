name: C++ compiler image

on:
  pull_request:
    paths:
      - docker/cpp/**
      - .github/workflows/cpp-compiler.yml
  push:
    tags: [cpp-compiler-v*]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name == 'pull_request' || (github.event.created && github.repository == 'BatchGradeTeam/BatchGrade')
    name: Build and verify (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the release commit to be on v2
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...v2?per_page=1" --jq .status)
          case "$status" in
            identical|ahead) ;;
            *) echo 'The compiler release tag must point to a commit on v2.' >&2; exit 1 ;;
          esac
      - name: Install OCI image tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Build, measure, and test image
        run: bash docker/cpp/build-and-test.sh '${{ matrix.architecture }}' "$RUNNER_TEMP/compiler"
      - name: Upload the package inventory and build record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiler-record-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/compiler/packages.tsv
            ${{ runner.temp }}/compiler/release.json
          if-no-files-found: error
          overwrite: true
      - name: Upload the verified OCI archive for publication
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiler-image-${{ matrix.architecture }}
          path: ${{ runner.temp }}/compiler/compiler.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.event.created && github.repository == 'BatchGradeTeam/BatchGrade'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ghcr.io/batchgradeteam/batchgrade-cpp-compiler
    steps:
      - name: Download the verified images and records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: compiler-*
          path: ${{ runner.temp }}/compiler-release
      - name: Install OCI image tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Publish exact artifacts and verify anonymous registry access
        working-directory: ${{ runner.temp }}/compiler-release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/ghcr-auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          printf '{"auths":{}}\n' > "$RUNNER_TEMP/anonymous-auth.json"
          for architecture in amd64 arm64; do
            record="compiler-record-$architecture/release.json"
            digest=$(jq -er --arg sha "$GITHUB_SHA" --arg arch "$architecture" \
              'select(.commit == $sha and .architecture == $arch) | .digest' "$record")
            tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$architecture"
            skopeo copy --preserve-digests --dest-authfile "$RUNNER_TEMP/ghcr-auth.json" \
              "oci-archive:compiler-image-$architecture/compiler.tar" "docker://$REPOSITORY:$tag"
            skopeo copy --src-authfile "$RUNNER_TEMP/anonymous-auth.json" \
              "docker://$REPOSITORY@$digest" "oci:$RUNNER_TEMP/anonymous-$architecture:verify"
          done
          jq -n --slurpfile amd64 compiler-record-amd64/release.json \
            --slurpfile arm64 compiler-record-arm64/release.json \
            '{amd64: $amd64[0].digest, arm64: $arm64[0].digest}' > image-digests.json
          {
            echo 'Copy these verified pins into `docker/cpp/image-digests.json`.'
            echo '```json'
            cat image-digests.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the new image pins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiler-image-digests
          path: ${{ runner.temp }}/compiler-release/image-digests.json
          if-no-files-found: error
          overwrite: true
